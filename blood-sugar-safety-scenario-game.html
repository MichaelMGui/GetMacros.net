<a class="skip-link" href="#main-content">Skip to main content</a><header class="site-header"><a class="logo" href="index.html">GetMacros.net</a><nav aria-label="Main navigation"><a href="articles.html">Articles</a><a href="calculators.html">Tools</a><a href="quiz.html">Games</a><a href="search.html">Search</a></nav></header><main id="main-content"><section class="article-container"><p class="eyebrow">Eight practical decisions</p><h1>Blood-sugar safety scenario game</h1><p class="lead">Check your reasoning about labels, meals, low glucose, exercise, monitoring and emergencies.</p><div id="game"><h2 id="q"></h2><div id="a"></div><p id="f" class="callout" aria-live="polite"></p><button id="n" hidden>Next question</button><p id="p"></p></div><p><a href="diabetes-blood-sugar-nutrition-guides.html">Explore all blood-sugar guides</a></p></section></main><footer><p>© 2026 GetMacros.net · <a href="editorial-policy.html">Editorial policy</a> · <a href="privacy.html">Privacy</a></p></footer><script>(()=>{const d=[["For carbohydrate counting, which label line is the starting point?",["Total sugars","Total carbohydrate","Protein"],1,"Total carbohydrate includes starch, sugars and fibre. Do not add sugars again."],["A food has 30 g carbohydrate per serving. You eat 1.5 servings. Total?",["20 g","30 g","45 g"],2,"Multiply the label value by the servings actually eaten: 30 × 1.5 = 45 g."],["Does diabetes require eliminating all carbohydrate?",["Yes","No","Only fruit"],1,"Carbohydrate can fit; amount, timing and medication plan are individualized."],["An alert adult has glucose below their low threshold. The plan usually prioritizes:",["Fast-acting carbohydrate and rechecking","Chocolate only","Going to sleep"],0,"Fast carbohydrate works more predictably. Follow the person’s prescribed low-glucose plan."],["An unconscious person with suspected hypoglycemia should receive juice by mouth.",["True","False","Only through a straw"],1,"Do not give food or drink to someone who cannot swallow safely. Use glucagon if trained and call emergency services."],["Can exercise cause delayed low glucose with insulin?",["Yes","No","Only in heat"],0,"Activity can affect glucose for hours, so monitoring and preparation matter."],["A single CGM spike proves a food is forbidden.",["True","False","Only at breakfast"],1,"Interpret repeated patterns alongside sleep, stress, activity, medication and sensor limitations."],["High glucose with vomiting, deep breathing and high ketones needs:",["A detox drink","Urgent medical action","A fibre supplement"],1,"These can signal diabetic ketoacidosis, a medical emergency."]],q=document.getElementById('q'),a=document.getElementById('a'),f=document.getElementById('f'),n=document.getElementById('n'),p=document.getElementById('p');let i=0,s=0;function draw(){const x=d[i];q.textContent=x[0];a.innerHTML='';f.textContent='';n.hidden=true;x[1].forEach((v,j)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{[...a.children].forEach(z=>z.disabled=true);const ok=j===x[2];if(ok)s++;f.textContent=(ok?'Correct. ':'Not quite. ')+x[3];n.hidden=false;n.focus()};a.appendChild(b)});p.textContent='Question '+(i+1)+' of '+d.length}n.onclick=()=>{if(++i<d.length)draw();else{q.textContent='Finished';a.innerHTML='';f.textContent='You answered '+s+' of '+d.length+' correctly. Review any safety explanation that surprised you.';n.hidden=true;p.textContent='Complete'}};draw()})()</script><script src="js/main.js?v=20260816g"></script></body></html>
