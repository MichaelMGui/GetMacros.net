<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    .s { font-family: "Instrument Sans", system-ui, -apple-system, sans-serif; }
    a { color: #0f7a4a; } a:hover { color: #0a3d26; }
  </style>
</helmet>
<div class="s" style="width: 880px; height: 620px; box-sizing: border-box; background: #ffffff; color: #0d1b14; padding: 46px 54px; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 52px">
    <span style="font-size: 17px; font-weight: 700; letter-spacing: -.02em">GetMacros</span>
    <span style="font-size: 12.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: #7c8b83">D · Clean</span>
  </div>

  <h1 style="margin: 0 0 20px; font-size: 60px; font-weight: 600; line-height: 1.02; letter-spacing: -.038em; max-width: 15ch">
    Fast food that fits your goal.
  </h1>
  <p style="margin: 0 0 34px; max-width: 46ch; font-size: 17px; line-height: 1.6; color: #5c6b64">
    Answer five short questions. Get real menu orders ranked by the numbers that matter.
  </p>

  <div style="display: flex; gap: 12px; align-items: center; margin-bottom: 46px">
    <span style="display: inline-flex; align-items: center; height: 46px; padding: 0 24px; border-radius: 10px; background: #0d1b14; color: #fff; font-size: 15px; font-weight: 600">Find my meal</span>
    <span style="display: inline-flex; align-items: center; height: 46px; padding: 0 20px; border-radius: 10px; border: 1px solid #dfe5e1; font-size: 15px; font-weight: 600">Calculate macros</span>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-top: auto">
    <div style="border: 1px solid #e8ece9; border-radius: 14px; padding: 20px">
      <div style="font-size: 30px; font-weight: 600; letter-spacing: -.03em">83</div>
      <div style="font-size: 14px; color: #7c8b83; margin-top: 2px">meals on file</div>
    </div>
    <div style="border: 1px solid #e8ece9; border-radius: 14px; padding: 20px">
      <div style="font-size: 30px; font-weight: 600; letter-spacing: -.03em">15</div>
      <div style="font-size: 14px; color: #7c8b83; margin-top: 2px">restaurants</div>
    </div>
    <div style="border: 1px solid #e8ece9; border-radius: 14px; padding: 20px; background: #f2f8f4">
      <div style="font-size: 30px; font-weight: 600; letter-spacing: -.03em; color: #0f7a4a">Free</div>
      <div style="font-size: 14px; color: #5c7a6a; margin-top: 2px">no account</div>
    </div>
  </div>

  <p style="margin: 22px 0 0; font-size: 13px; color: #9aa8a1">White space, one green, one weight of type. Nothing decorative.</p>
</div>
</x-dc>
</body>
</html>
