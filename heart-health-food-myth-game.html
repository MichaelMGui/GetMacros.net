<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heart-Health Food Myth Game | GetMacros.net</title><meta name="description" content="Test eight practical decisions about DASH, sodium, potassium, fats, fibre, triglycerides and urgent symptoms."><meta name="author" content="The GetMacros.net editorial team"><link rel="canonical" href="https://getmacros.net/heart-health-food-myth-game.html"><link rel="stylesheet" href="css/style.css?v=20260814d"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2316153877942502" crossorigin="anonymous"></script><script type="application/ld+json">{"@context":"https://schema.org","@type":"LearningResource","name":"Heart-Health Food Myth Game","description":"Test eight practical decisions about DASH, sodium, potassium, fats, fibre, triglycerides and urgent symptoms.","url":"https://getmacros.net/heart-health-food-myth-game.html","author":{"@type":"Organization","name":"The GetMacros.net editorial team"},"publisher":{"@type":"Organization","name":"GetMacros.net"}}</script></head><body><header class="site-header"><a class="logo" href="index.html">GetMacros.net</a><nav aria-label="Main navigation"><a href="articles.html">Articles</a><a href="calculators.html">Tools</a><a href="quiz.html">Games</a><a href="search.html">Search</a></nav></header><main><section class="article-container"><p class="eyebrow">Eight evidence checks</p><h1>Heart-health food myth game</h1><p class="lead">Practice reading sodium labels, applying DASH, understanding fats and recognising clinical boundaries.</p><div id="game"><h2 id="q"></h2><div id="a"></div><p id="f" class="callout" aria-live="polite"></p><button id="n" hidden>Next question</button><p id="p"></p></div><p><a href="heart-health-nutrition-guides.html">Explore the complete heart-health collection</a></p></section></main><footer><p>© 2026 GetMacros.net · <a href="editorial-policy.html">Editorial policy</a> · <a href="privacy.html">Privacy</a></p></footer><script>(()=>{const d=[["A soup lists 700 mg sodium per serving and two servings per container. You eat the whole container. How much sodium?",["700 mg","1,400 mg","2,300 mg"],1,"Multiply by the servings actually eaten: 700 × 2 = 1,400 mg."],["What does “reduced sodium” guarantee?",["The food is low sodium","At least a defined reduction from a reference food","It has no added salt"],1,"It is a comparison claim. The product can still contain substantial sodium, so check the panel."],["Which change best reflects DASH?",["Buy branded diet food","Add plant foods and reduce frequent high-sodium choices","Eliminate all carbohydrate"],1,"DASH is a flexible food pattern, not a branded product list or carbohydrate-free diet."],["Who should check before using potassium salt substitute?",["Anyone with kidney disease or potassium-affecting medicines","Only athletes","Nobody"],0,"Potassium chloride can be unsafe when kidney function or medicines limit potassium handling."],["For LDL, what matters about replacing saturated fat?",["Replace it with unsaturated fat","Replace it only with added sugar","Nothing replaces it"],0,"The replacement nutrient affects the outcome; unsaturated fats are the useful direction."],["A cereal says “made with oats.” What next?",["Assume it lowers cholesterol","Check serving, fibre, added sugar and sodium","Eat unlimited portions"],1,"A front claim highlights one feature. The full label provides the needed context."],["What can substantially raise triglycerides for some people?",["Alcohol and sugary drinks","Plain water","Unsalted herbs"],0,"Alcohol, liquid sugar and other factors can raise triglycerides; very high results need clinical care."],["Chest pressure with shortness of breath should be handled by:",["Trying a low-sodium snack","Emergency services","Waiting for the next lipid test"],1,"Possible heart symptoms need emergency assessment. Nutrition tools cannot rule out an emergency."]],q=document.getElementById('q'),a=document.getElementById('a'),f=document.getElementById('f'),n=document.getElementById('n'),p=document.getElementById('p');let i=0,s=0;function draw(){const x=d[i];q.textContent=x[0];a.innerHTML='';f.textContent='';n.hidden=true;x[1].forEach((v,j)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{[...a.children].forEach(z=>z.disabled=true);const ok=j===x[2];if(ok)s++;f.textContent=(ok?'Correct. ':'Not quite. ')+x[3];n.hidden=false;n.focus()};a.appendChild(b)});p.textContent='Question '+(i+1)+' of '+d.length}n.onclick=()=>{if(++i<d.length)draw();else{q.textContent='Finished';a.innerHTML='';f.textContent='You answered '+s+' of '+d.length+' correctly. Revisit any explanation that surprised you.';n.hidden=true;p.textContent='Complete'}};draw()})()</script></body></html>
