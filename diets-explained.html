<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is an animal-based diet?", "acceptedAnswer": {"@type": "Answer", "text": "An animal-based diet emphasizes meat, organs, fish, eggs, and dairy, with limited plant foods \u2014 typically fruit, honey, and some low-toxin vegetables. It's more flexible than carnivore but far more restrictive than a standard omnivorous diet."}}, {"@type": "Question", "name": "What is a plant-based diet?", "acceptedAnswer": {"@type": "Answer", "text": "Plant-based means the majority of calories come from plant foods, but unlike vegan, it doesn't necessarily exclude all animal products entirely \u2014 it's a spectrum, not a strict rule."}}, {"@type": "Question", "name": "What is a vegan diet?", "acceptedAnswer": {"@type": "Answer", "text": "A vegan diet excludes all animal products, including meat, dairy, eggs, and honey, relying entirely on plant foods for every nutrient, including protein."}}, {"@type": "Question", "name": "What is the paleo diet?", "acceptedAnswer": {"@type": "Answer", "text": "The paleo diet is based on foods presumed available to Paleolithic humans \u2014 meat, fish, fruit, vegetables, nuts, and seeds \u2014 while excluding grains, legumes, dairy, and refined sugar."}}, {"@type": "Question", "name": "What is the carnivore diet?", "acceptedAnswer": {"@type": "Answer", "text": "The carnivore diet consists exclusively of animal products \u2014 meat, fish, eggs, and sometimes dairy \u2014 excluding all plant foods, including fruits and vegetables."}}, {"@type": "Question", "name": "What is a vegetarian diet?", "acceptedAnswer": {"@type": "Answer", "text": "A vegetarian diet excludes meat, poultry, and fish, but typically still includes eggs and dairy, making it easier to hit protein targets than a fully vegan diet."}}, {"@type": "Question", "name": "What is a pescatarian diet?", "acceptedAnswer": {"@type": "Answer", "text": "A pescatarian diet excludes meat and poultry but includes fish and seafood, along with eggs, dairy, and plant foods \u2014 often described as vegetarian plus fish."}}, {"@type": "Question", "name": "What is the keto diet?", "acceptedAnswer": {"@type": "Answer", "text": "The ketogenic diet keeps carbs very low (usually under 50g/day) and fat very high (roughly 70-80% of calories) to shift the body into ketosis, burning fat and ketones for fuel instead of glucose."}}, {"@type": "Question", "name": "What is the Mediterranean diet?", "acceptedAnswer": {"@type": "Answer", "text": "The Mediterranean diet emphasizes vegetables, fruit, whole grains, legumes, olive oil, and fish, with red meat and processed food kept minimal \u2014 it has one of the strongest research bases of any named diet, including the landmark PREDIMED cardiovascular trial."}}]}</script>
