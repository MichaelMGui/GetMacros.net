name: Site quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Rebuild and validate the focused site
        run: |
          exec > >(tee -a "$RUNNER_TEMP/getmacros-validation.log") 2>&1
          sh tools/build_site.sh
      - name: Test filtering, units and calculator formulas
        run: |
          exec > >(tee -a "$RUNNER_TEMP/getmacros-validation.log") 2>&1
          node tools/test_macro_math.js
          node tools/product_release/test-food.cjs
          node --test tools/diary_reference/test_goals.cjs
          node --test tools/brand_assets/test.cjs
          node tools/product_release/test-ingredient-comparison.cjs
          python3 tools/product_release/test-generators.py
          node --test server/test/service.test.cjs
          node tools/test-companion-engine.cjs
          node tools/test-meal-view.cjs
          node tools/test-growth-tools.cjs
          node tools/international/test-markets.cjs
          python3 tools/growth_release/review-source.py --validate
          python3 tools/test_growth_release.py
          node tools/play_release/test-rules.cjs
          python3 tools/test-release-content.py
          python3 tools/test_asset_stamps.py
          node tools/master_release/test-branded-search.cjs
          node tools/master_release/test-branded-integrity.cjs
          node tools/master_release/test-diary-meals.cjs
          node tools/master_completion/test-source-ui.cjs
          python3 tools/master_completion/grocery_integrity_off.py
          python3 tools/master_completion/test_integration.py
          node tools/master_completion/grocery-search-off.cjs
          node tools/clarity_release/test-comparison.cjs
          node tools/global_coverage_2026_10_17/library_market_search.cjs
          node tools/global_coverage_2026_10_17/usda_test_search.cjs
          python3 tools/global_coverage_2026_10_17/restaurant_verify.py
          python3 tools/global_coverage_2026_10_17/restaurant_newmarkets_verify.py
          python3 tools/global_coverage_2026_10_17/restaurant-supplement-verify.py
          python3 tools/global_coverage_2026_10_17/mexico-supplement-test.py
          python3 tools/clarity_release/test_restaurant_additions.py
          python3 tools/clarity_release/test_mexico_classification.py
          python3 tools/clarity_release/test_character_media.py
          python3 tools/clarity_release/test_editorial.py
          python3 tools/flagship_release/markets_test.py
          python3 tools/flagship_release/markets_mexico_calories.py --test
          python3 tools/flagship_release/uk_verify.py
          python3 tools/flagship_release/data_audit.py
          python3 tools/flagship_release/test_finder_payload.py
          python3 tools/ultimate_release/test_release.py
          python3 tools/ultimate_release/test_editorial_restaurants.py
          python3 tools/ultimate_release/test_editorial_foodtools.py
          node --test tools/ultimate_release/journey_runtime_test.cjs
      - name: Expose failed validation output
        if: failure()
        run: python3 tools/ci_failure_summary.py
