eElement('button');b.type='button';b.textContent=x;b.onclick=()=>z(x);a.appendChild(b)});f.textContent='';n.hidden=true}function z(x){[...a.children].forEach(b=>b.disabled=true);const o=x===q[i][1];if(o)s++;f.textContent=(o?'Correct. ':'Not quite. ')+q[i][2];n.hidden=false;n.textContent=i===q.length-1?'See result':'Next'}n.onclick=()=>{i++;if(i<q.length)d();else document.querySelector('#game').innerHTML='<h2>Your score: '+s+' / '+q.length+'</h2><p>Use official live data and compare the complete order.</p><button type="button" onclick="location.reload()">Play again</button>'};d();</script></article></main><footer><p>Â© 2026 GetMacros.net Â· <a href="editorial-policy.html">Editorial policy</a> Â· <a href="privacy.html">Privacy</a></p></footer><script src="js/main.js?v=20260816g"></script></body></html>
