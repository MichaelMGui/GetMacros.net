 needs:",["Emergency care","A low-sodium snack","More water"],0,"This can signal variceal bleeding and requires urgent treatment."],["Does everyone with ascites need to guess a fluid limit?",["Yes","No","Only in summer"],1,"Fluid plans depend on sodium, symptoms, medicines and clinical status."],["Food safety in cirrhosis includes avoiding:",["Raw or undercooked shellfish","Cooked grains","Pasteurized yogurt"],0,"Advanced liver disease increases the danger from foodborne infections."]],q=document.getElementById('q'),a=document.getElementById('a'),f=document.getElementById('f'),n=document.getElementById('n'),p=document.getElementById('p');let i=0,s=0;function draw(){const x=d[i];q.textContent=x[0];a.innerHTML='';f.textContent='';n.hidden=true;x[1].forEach((v,j)=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{[...a.children].forEach(z=>z.disabled=true);const ok=j===x[2];if(ok)s++;f.textContent=(ok?'Correct. ':'Not quite. ')+x[3];n.hidden=false;n.focus()};a.appendChild(b)});p.textContent='Question '+(i+1)+' of '+d.length}n.onclick=()=>{if(++i<d.length)draw();else{q.textContent='Finished';a.innerHTML='';f.textContent='You answered '+s+' of '+d.length+' correctly. Review any safety explanation that surprised you.';n.hidden=true;p.textContent='Complete'}};draw()})()</script><script src="js/main.js?v=20260816g"></script></body></html>
