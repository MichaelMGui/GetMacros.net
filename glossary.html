<script type="application/ld+json">{"@context": "https://schema.org", "@type": "DefinedTermSet", "name": "Nutrition Glossary", "url": "https://getmacros.net/glossary.html", "inLanguage": "en", "description": "An A-Z glossary of macronutrient and nutrition science terms for students.", "hasDefinedTerm": [{"@type": "DefinedTerm", "name": "Acceptable Macronutrient Distribution Range (AMDR)", "description": "The range of intake for a macronutrient associated with reduced risk of chronic disease while providing adequate intake of essential nutrients \u2014 10-35% of calories from protein, 20-35% from fat, 45-65% from carbohydrate.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#acceptable-macronutrient-distribution-range-amdr"}, {"@type": "DefinedTerm", "name": "Amino acid", "description": "The building block of protein. 20 exist in the human body; 9 are essential and must come from food.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#amino-acid"}, {"@type": "DefinedTerm", "name": "Anabolism", "description": "The metabolic process of building larger molecules from smaller ones, such as building muscle protein from amino acids. The opposite of catabolism.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#anabolism"}, {"@type": "DefinedTerm", "name": "Basal Metabolic Rate (BMR)", "description": "The number of calories your body burns at complete rest just to maintain basic functions like breathing and circulation.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#basal-metabolic-rate-bmr"}, {"@type": "DefinedTerm", "name": "Bulking", "description": "A deliberate phase of eating in a calorie surplus to support muscle growth.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#bulking"}, {"@type": "DefinedTerm", "name": "Calorie", "description": "A unit of energy. In nutrition, \"Calorie\" (capital C) technically refers to a kilocalorie, the energy needed to raise 1kg of water by 1\u00b0C.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#calorie"}, {"@type": "DefinedTerm", "name": "Carbohydrate", "description": "One of the three macronutrients; broken down into glucose for energy and stored as glycogen.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#carbohydrate"}, {"@type": "DefinedTerm", "name": "Catabolism", "description": "The metabolic process of breaking larger molecules into smaller ones for energy, such as breaking down muscle protein into amino acids. The opposite of anabolism.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#catabolism"}, {"@type": "DefinedTerm", "name": "Cholesterol", "description": "A waxy lipid used to build cell membranes and steroid hormones; found in food and also produced by the liver.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#cholesterol"}, {"@type": "DefinedTerm", "name": "Complete protein", "description": "A protein source that supplies all 9 essential amino acids in sufficient amounts.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#complete-protein"}, {"@type": "DefinedTerm", "name": "Cutting", "description": "A deliberate phase of eating in a calorie deficit to lose body fat while trying to preserve muscle.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#cutting"}, {"@type": "DefinedTerm", "name": "Deficit (calorie)", "description": "Eating fewer calories than your body burns (TDEE), causing weight loss over time.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#deficit-calorie"}, {"@type": "DefinedTerm", "name": "Dietary Reference Intakes (DRI)", "description": "A set of nutrient reference values (including RDA and AMDR) published by the U.S. National Academies used to plan and assess diets.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#dietary-reference-intakes-dri"}, {"@type": "DefinedTerm", "name": "Disaccharide", "description": "A carbohydrate made of two linked sugar units, such as sucrose (table sugar) or lactose (milk sugar).", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#disaccharide"}, {"@type": "DefinedTerm", "name": "Essential amino acid", "description": "One of 9 amino acids the body cannot synthesize on its own and must obtain from food.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#essential-amino-acid"}, {"@type": "DefinedTerm", "name": "Essential fatty acid (EFA)", "description": "A fat the body cannot make itself \u2014 omega-3 and omega-6 fatty acids \u2014 and must get from food.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#essential-fatty-acid-efa"}, {"@type": "DefinedTerm", "name": "Fiber", "description": "A type of carbohydrate the body can't fully digest; supports digestion, blood sugar control, and gut health.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#fiber"}, {"@type": "DefinedTerm", "name": "Glucose", "description": "The simple sugar cells use directly for energy; the main breakdown product of dietary carbohydrate.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#glucose"}, {"@type": "DefinedTerm", "name": "Gluconeogenesis", "description": "The process of making new glucose from non-carbohydrate sources, including amino acids from protein \u2014 increases when carbohydrate and glycogen are low.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#gluconeogenesis"}, {"@type": "DefinedTerm", "name": "Glycemic index (GI)", "description": "A ranking of how quickly a carbohydrate food raises blood sugar compared to pure glucose.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#glycemic-index-gi"}, {"@type": "DefinedTerm", "name": "Glycogen", "description": "The storage form of glucose, held mainly in muscle and liver tissue and used as an energy reserve.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#glycogen"}, {"@type": "DefinedTerm", "name": "Hydrogenation", "description": "An industrial process that adds hydrogen to liquid vegetable oil to make it more solid; partial hydrogenation is the main source of artificial trans fat.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#hydrogenation"}, {"@type": "DefinedTerm", "name": "IIFYM", "description": "\"If It Fits Your Macros\" \u2014 a flexible dieting approach where food choices are unrestricted as long as daily macro targets are met.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#iifym"}, {"@type": "DefinedTerm", "name": "Insulin", "description": "A hormone that lowers blood sugar by helping cells absorb glucose from the bloodstream.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#insulin"}, {"@type": "DefinedTerm", "name": "Joule", "description": "The SI unit of energy; 1 dietary Calorie (kilocalorie) equals about 4,184 joules. Used alongside Calories on some nutrition labels outside the US.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#joule"}, {"@type": "DefinedTerm", "name": "Ketosis", "description": "A metabolic state where the body burns fat and produces ketones for fuel instead of relying primarily on glucose, typically triggered by very low carbohydrate intake.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#ketosis"}, {"@type": "DefinedTerm", "name": "Kwashiorkor", "description": "A severe form of malnutrition caused by inadequate protein intake, causing swelling, a swollen liver, and impaired growth.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#kwashiorkor"}, {"@type": "DefinedTerm", "name": "Lipid", "description": "The broader scientific term for fats and fat-like substances, including triglycerides and cholesterol.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#lipid"}, {"@type": "DefinedTerm", "name": "Macronutrient", "description": "A nutrient the body needs in large amounts for energy: protein, fat, or carbohydrate.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#macronutrient"}, {"@type": "DefinedTerm", "name": "Maintenance calories", "description": "The number of calories that keeps body weight stable \u2014 roughly equal to TDEE.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#maintenance-calories"}, {"@type": "DefinedTerm", "name": "Metabolism", "description": "The sum of all chemical processes that convert food into energy and building blocks for the body.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#metabolism"}, {"@type": "DefinedTerm", "name": "Micronutrient", "description": "A nutrient needed in small amounts, such as a vitamin or mineral; doesn't provide calories.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#micronutrient"}, {"@type": "DefinedTerm", "name": "Monounsaturated fat", "description": "An unsaturated fat with one double bond in its chemical structure; liquid at room temperature. Found in olive oil and avocado.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#monounsaturated-fat"}, {"@type": "DefinedTerm", "name": "Muscle protein synthesis (MPS)", "description": "The biological process of building new muscle protein, stimulated by both resistance exercise and protein intake.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#muscle-protein-synthesis-mps"}, {"@type": "DefinedTerm", "name": "Nitrogen balance", "description": "A measure comparing nitrogen (protein) intake to nitrogen loss, used to assess whether the body is gaining, maintaining, or losing protein/muscle mass overall.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#nitrogen-balance"}, {"@type": "DefinedTerm", "name": "Omega-3 fatty acid", "description": "An essential polyunsaturated fat found in fatty fish, walnuts, and flaxseed; involved in reducing inflammation.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#omega-3-fatty-acid"}, {"@type": "DefinedTerm", "name": "Omega-6 fatty acid", "description": "An essential polyunsaturated fat abundant in vegetable oils; needed in balance with omega-3.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#omega-6-fatty-acid"}, {"@type": "DefinedTerm", "name": "Physical Activity Level (PAL)", "description": "A multiplier applied to BMR to estimate total daily energy expenditure based on activity level.", "inDefinedTermSet": "https://getmacros.net/glossary.html", "url": "https://getmacros.net/glossary.html#physical-activity-level-pal"}, {"@type": "DefinedTe
