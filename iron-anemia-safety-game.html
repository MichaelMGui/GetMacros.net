stion '+(i+1)+' of '+d.length}n.onclick=()=>{if(++i<d.length)draw();else{q.textContent='Finished';a.innerHTML='';f.textContent='You answered '+s+' of '+d.length+' correctly. Review any safety explanation that surprised you.';n.hidden=true;p.textContent='Complete'}};draw()})()</script></body></html>
