<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><title>Protein density is not meal size.</title><desc>Selected U.S. portions. Extra sauces, sides and drinks excluded. Facts inspected October 3, 2026; official sources are linked on the reference page.</desc><rect width="1200" height="630" fill="#fffefb"/><g fill="#152d24" font-family="Inter, Arial, sans-serif"><text x="60" y="66" font-size="26" fill="#276443" font-weight="600">GetMacros / Menu notes</text><text x="60" y="132" font-size="44" font-weight="600">Protein density is not meal size.</text><text x="60" y="179" font-size="26" fill="#59665d">Compare the protein portion, then add your sides.</text><rect x="60" y="220" width="525" height="220" rx="16" fill="#fff" stroke="#dce2d8"/><text x="84" y="266" font-size="27" font-weight="600">Chick-fil-A</text><text x="84" y="304" font-size="20" fill="#59665d">8 grilled nuggets, without dipping sauce</text><text x="84" y="356" font-size="27" font-weight="600">130 calories · 25 g protein</text><text x="84" y="396" font-size="21" fill="#276443">19.2 g protein / 100 calories</text><rect x="615" y="220" width="525" height="220" rx="16" fill="#fff" stroke="#dce2d8"/><text x="639" y="266" font-size="27" font-weight="600">Panda Express</text><text x="639" y="304" font-size="20" fill="#59665d">6.1 oz chicken entree</text><text x="639" y="356" font-size="27" font-weight="600">280 calories · 38 g protein</text><text x="639" y="396" font-size="21" fill="#276443">13.6 g protein / 100 calories</text><text x="60" y="490" font-size="20">Selected U.S. portions. Extra sauces, sides and drinks excluded.</text><text x="60" y="544" font-size="21" fill="#276443">getmacros.net/protein-density-fast-food.html</text><text x="60" y="588" font-size="18" fill="#59665d">Source-linked analysis · Inspected October 3, 2026 · Original graphic</text></g></svg>